<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Web Analytics Dev logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232f57"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1c6"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="none" stroke="#38e1c6" stroke-opacity="0.25" stroke-width="14"/>
  <!-- rising analytics bars -->
  <g opacity="0.9">
    <rect x="200" y="620" width="90" height="200" rx="26" fill="#38e1c6" opacity="0.35"/>
    <rect x="330" y="540" width="90" height="280" rx="26" fill="#38e1c6" opacity="0.55"/>
    <rect x="460" y="450" width="90" height="370" rx="26" fill="#38e1c6" opacity="0.75"/>
    <rect x="590" y="360" width="90" height="460" rx="26" fill="#8b7bff" opacity="0.85"/>
  </g>
  <!-- heartbeat / uptime pulse line -->
  <path d="M150 560 L330 560 L400 380 L500 700 L580 470 L650 530 L880 530"
        fill="none" stroke="url(#pulse)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live dot -->
  <circle cx="800" cy="250" r="52" fill="#3ddc84"/>
  <circle cx="800" cy="250" r="52" fill="none" stroke="#3ddc84" stroke-opacity="0.5" stroke-width="22"/>
</svg>
